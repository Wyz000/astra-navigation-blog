name: Import verified blog media
on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-blog-media.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Copy and verify media from the published article
        shell: bash
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          from urllib.request import urlopen
          from concurrent.futures import ThreadPoolExecutor
          import base64, hashlib, re
          EXPECTED = {'assets/demo-11-poster.jpg': 'c1b451b885cb336ea853026e58ab8c04eef4c80f', 'assets/demo-05-poster.jpg': '98a86ef85c1251235004ae700f68d265d1973d5d', 'assets/demo-14-poster.jpg': 'f751e5ffe684d9accb9ffbeb367054020902da00', 'assets/demo-08-poster.jpg': 'a2c424c6ea8d6ab897e3972cc86bfed17e53b9da', 'assets/demo-02.mp4': '264876d32244aadd84612f70f6c5355c4eedf77d', 'assets/figure-02.png': '6ebfe47dfb71be12811e31805178f712512fb4b4', 'assets/figure-03.png': '3e4cc2f4dd1577c8669e61a325cfcd77b36f450c', 'assets/demo-03.mp4': '81d611f4f4bcb361f9ad9f9330e1adbc2102c37e', 'assets/demo-13-poster.jpg': '1b6a39329c278c992fa3f6e11a4ff1b55e162020', 'assets/demo-02-poster.jpg': '94ff65ce7556685575d6587df3c323501528da7d', 'assets/demo-15.mp4': '0ad80ffb5793e4123ad9515955156d3e52f350e3', 'assets/demo-01.mp4': '3f5509af4ae8ea63ca5abf3d95224248988fd9ec', 'assets/figure-01.jpg': '5de9270f41335b496dcf335a5c1138b192845c74', 'assets/demo-14.mp4': '66973739967e43d114c03573a098f1f9972c3eb6', 'assets/demo-10.mp4': '4b69c7c9a15ff421a4c32e8079427ae982c417a8', 'assets/demo-04.mp4': 'bd13942090f3d78baa07216d1654e205f640bb74', 'assets/demo-07-poster.jpg': '4ba54142656e9e7e169c8f3c0bf12957a8502478', 'assets/figure-04.png': 'c4f7c4a773034ccaedb412f906796cce66727d58', 'assets/figure-05.png': 'a82f1f52ce7a79389e907376c4f027bec3db64bc', 'assets/demo-05.mp4': 'bc50a6b2bd51d860321f6b50ce7d20667c5cf1b5', 'assets/demo-11.mp4': 'c50576bb45f62a929ee2ed1b94870da9cad10d41', 'assets/demo-07.mp4': 'e66bf74bd843565e4005befef15bad05549127f0', 'assets/demo-13.mp4': 'aad801ff9871d29e2ac9819964b4eed2b637ceca', 'assets/figure-07.png': 'a2353807784352738a2f5c615f4c2b7a6c580f64', 'assets/figure-06.png': 'fd94fb50fa75b94ef4e37726cc5097df19de8be3', 'assets/demo-12.mp4': '36ee6da5265d17ebbe1289066bb15553a6019563', 'assets/demo-06.mp4': '4520a03793f3b61d331ce4dc564e41ebbce6c580', 'assets/demo-04-poster.jpg': 'c0657e4c3316a954aabb0b8b80161ea486279164', 'assets/demo-08.mp4': '391416f9b1721daa8de1930b9ab6c646c28c1f4a', 'assets/demo-15-poster.jpg': '15e8d31d7278eee1fdbc7a2b12d9dbbb88837ddc', 'assets/figure-08.png': 'b7a7ed344f37999f3b489e2991875d36b7a5315a', 'assets/demo-09.mp4': '0ccdde8b3d7cc15bb53225f2de15ab12584e86cb', 'assets/demo-09-poster.jpg': '0ea2822e45c6f0e4febd2bb1935fca4e0f296e68', 'assets/demo-10-poster.jpg': 'f85290accab08e285710574986de3cd7a1f772ac', 'assets/team-logo.png': 'c0caeb2bd18c3af8de7ef6703caedc0c880b952a', 'assets/demo-01-poster.jpg': '62aae64a6ed7c47e0e14b2913c9b5e97f3504b50', 'assets/demo-06-poster.jpg': '7e674b969a945c10041b57b2d3cfb86c027fdb71', 'assets/demo-12-poster.jpg': '72fdc53c051fb49ca8448ca1e082ed828def4ca4', 'assets/demo-03-poster.jpg': '803d4a1622b8701aba2886d15bcdb97da0b14070'}
          SOURCE = 'https://raw.githubusercontent.com/Wyz000/Wyz000.github.io/e95e24647964837dd46fc942ebd26d7ccceb6490/blog/gpt6-astra-navigation/'
          def import_file(item):
              name, expected = item
              if name == 'assets/team-logo.png':
                  source = Path('index.html').read_text()
                  data = base64.b64decode(re.search(r'class="brand-mark" src="data:image/png;base64,([^"]+)"', source)[1])
              else:
                  with urlopen(SOURCE + name, timeout=120) as response:
                      data = response.read()
              actual = hashlib.sha1(('blob ' + str(len(data)) + '\0').encode() + data).hexdigest()
              if actual != expected:
                  raise RuntimeError('Checksum mismatch: ' + name)
              path = Path(name)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(data)
              return name
          with ThreadPoolExecutor(max_workers=4) as pool:
              for name in pool.map(import_file, EXPECTED.items()):
                  print('Verified:', name)
          print('All 39 media assets imported and verified.')
          PYTHON
      - name: Commit the independent media assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          if ! git diff --cached --quiet; then
            git commit -m "Import verified blog media into independent repository"
            git push origin HEAD:main
          fi
